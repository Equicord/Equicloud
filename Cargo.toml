[package]
name = "equicloud"
version = "0.1.4"
edition = "2024"

[lib]
name = "equicloud"
path = "src/lib/mod.rs"

[[bin]]
name = "equicloud"
path = "src/main.rs"

[dependencies]
axum = "0.8.4"
tokio = { version = "1.47.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", default-features = false, features = ["cors", "set-header", "limit"] }
tower_governor = "0.8"
governor = "0.10"
http = "1.3"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
dotenv = "0.15"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
scylla = "1.3.1"
anyhow = "1.0.100"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.9.2"
hex = "0.4.3"
base64 = "0.22.1"
once_cell = "1.21.3"
sha2 = "0.10.8"
zstd = "0.13"
futures = "0.3"
include_dir = "0.7"
moka = { version = "0.12", features = ["future"] }
mimalloc = { version = "0.1", default-features = false }
ahash = "0.8"
itoa = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = "line-tables-only"
incremental = false

# Slower-link, fastest-runtime profile for tagged release artifacts.
[profile.dist]
inherits = "release"
lto = "fat"
